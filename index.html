<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Louisiana Bait Products — 3D 부지 모델 v8</title>
<style>
  :root{
    --paper:#efeadb; --paper2:#e4ddc9; --ink:#25313a; --line:#25313a;
    --accent:#d9a521; --accent-ink:#3d2f05;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#b9cfd8;}
  body{font-family:ui-monospace,'Cascadia Mono','SF Mono',Consolas,'Nanum Gothic Coding',monospace;color:var(--ink);}
  #scene{position:absolute;inset:0;}
  .panel{
    position:absolute;background:var(--paper);border:1.5px solid var(--line);
    box-shadow:3px 3px 0 rgba(37,49,58,.25);padding:10px 14px;
  }
  #titleblock{top:16px;left:16px;max-width:370px;}
  #titleblock h1{font-size:15px;letter-spacing:.14em;font-weight:800;border-bottom:1.5px solid var(--line);padding-bottom:6px;margin-bottom:6px;}
  #titleblock .sub{font-size:11px;line-height:1.55;}
  #titleblock .meta{font-size:10px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);opacity:.75;line-height:1.5;}
  #controls{bottom:16px;left:16px;display:flex;flex-direction:column;gap:8px;padding:10px 12px;}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .row .lbl{font-size:10px;letter-spacing:.08em;opacity:.7;width:100%;}
  button{
    font-family:inherit;font-size:11px;letter-spacing:.05em;cursor:pointer;
    background:var(--paper);border:1.2px solid var(--line);color:var(--ink);
    padding:5px 10px;box-shadow:2px 2px 0 rgba(37,49,58,.2);
  }
  button:hover{background:var(--paper2);}
  button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(37,49,58,.2);}
  button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  #hint{bottom:16px;right:16px;font-size:10px;line-height:1.6;text-align:right;padding:8px 12px;}
  #compass{position:absolute;top:16px;right:16px;width:54px;height:54px;background:var(--paper);
    border:1.5px solid var(--line);border-radius:50%;box-shadow:3px 3px 0 rgba(37,49,58,.25);
    display:flex;align-items:center;justify-content:center;}
  #needle{width:100%;height:100%;position:relative;}
  #needle span{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;}
  #needle:before{content:'';position:absolute;left:50%;top:50%;width:2px;height:18px;background:var(--accent);
    transform-origin:bottom center;transform:translate(-50%,-100%);}
  #scene canvas{touch-action:none;display:block;}
  @media (max-width:640px){
    #titleblock{max-width:200px;padding:7px 9px;}
    #titleblock h1{font-size:11px;letter-spacing:.08em;}
    #titleblock .sub{font-size:9px;}
    #titleblock .meta{display:none;}
    #controls{left:8px;right:8px;bottom:8px;padding:8px 9px;gap:6px;}
    .row{gap:5px;}
    .row .lbl{font-size:9px;}
    button{font-size:11px;padding:9px 11px;}
    #compass{width:40px;height:40px;top:10px;right:10px;}
    #hint{display:none;}
  }
</style>
</head>
<body>
<div id="scene"></div>

<div class="panel" id="titleblock">
  <h1>LOUISIANA BAIT PRODUCTS · AMT</h1>
  <div class="sub">3D 부지 모델 v8 · 11934 Live Oak Rd, Abbeville, LA<br>Vermilion River 연안 미끼 급속냉동 공장 + AMT 시설</div>
  <div class="meta">근거: 2011 설계도면 · 2023 측량도 · 위성사진(AMT 이전) · 항공/현장사진<br>동측 트럭도크·자체 냉동창고(본동 절반 길이) 반영 · 실외 설비는 사진 기준 배치</div>
</div>

<div class="panel" id="controls">
  <div class="row"><span class="lbl">표시</span>
    <button id="btnLabels" class="on">시설 라벨</button>
    <button id="btnFlow">생산 흐름 (하역→냉동→보관→출하)</button>
    <button id="btnXray">본동 투시</button>
  </div>
  <div class="row"><span class="lbl">시점</span>
    <button data-view="aerial">조감</button>
    <button data-view="river">강변·선박</button>
    <button data-view="plant">LBP 플랜트</button>
    <button data-view="cold">냉동창고·도크</button>
    <button data-view="inside">본동 내부</button>
    <button data-view="amt">AMT</button>
  </div>
</div>

<div class="panel" id="hint">드래그 회전 · 휠 확대/축소<br>우클릭(또는 Shift)+드래그 이동</div>
<div id="compass" aria-hidden="true"><div id="needle"><span>N</span></div></div>

<script>
(function(){

  houseRoof:new THREE.MeshLambertMaterial({color:0x5a6268}),

  crane:new THREE.MeshLambertMaterial({color:0xd9a521}),
  vatBlue:new THREE.MeshLambertMaterial({color:0x2f6fd0}),
  toteBlack:new THREE.MeshLambertMaterial({color:0x2c2f33}),
  tfmr:new THREE.MeshLambertMaterial({color:0x7d8a7d}),
  propane:new THREE.MeshLambertMaterial({color:0xbcd8dc}),
  carRed:new THREE.MeshLambertMaterial({color:0xb2372e}),
  carDark:new THREE.MeshLambertMaterial({color:0x3a4048}),
  carSilver:new THREE.MeshLambertMaterial({color:0xc4c8cc}),
  bag:new THREE.MeshLambertMaterial({color:0xe7e7e2}),
  green:new THREE.MeshLambertMaterial({color:0x3f6d3a}),
};
function mesh(g,m,x,y,z,shadow=true){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);if(shadow){o.castShadow=true;o.receiveShadow=true;}return o;}
function box(w,h,d,m,x,y,z){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z);}
function pad(w,d,mat,x,z,ry=0,y=0.55){
  const g=new THREE.PlaneGeometry(w,d);g.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(g,mat);m.position.set(x,y,z);m.rotation.y=ry;m.receiveShadow=true;scene.add(m);return m;
}
function gable(w,d,h,mat,ridge){
  const cw=(ridge==='x'?d:w),len=(ridge==='x'?w:d);
  const s=new THREE.Shape();s.moveTo(-cw/2-2,0);s.lineTo(cw/2+2,0);s.lineTo(0,h);s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:len+4,bevelEnabled:false});g.translate(0,0,-(len+4)/2);
  const m=new THREE.Mesh(g,mat);if(ridge==='x')m.rotation.y=Math.PI/2;
  m.castShadow=m.receiveShadow=true;return m;
}
function monoRoof(w,d,rise,mat,dir){
  const s=new THREE.Shape();
  s.moveTo(-w/2,0);s.lineTo(w/2,0);s.lineTo(dir>0?w/2:-w/2,rise);s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false});g.translate(0,0,-d/2);
  const m=new THREE.Mesh(g,mat);m.castShadow=m.receiveShadow=true;return m;
}

// ————— 대지 · 지면
scene.add(box(960,22,660,M.base,0,-11.2,0));
{const g=mesh(new THREE.PlaneGeometry(660,630),M.grass,150,0.05,0);g.rotation.x=-Math.PI/2;g.castShadow=false;scene.add(g);}
pad(560,470,M.gravel,-10,-40,0,0.35);                        // 중앙 야드
pad(130,140,M.dirt,-262,55,0,0.5);                           // 브라인동 앞 나대지
pad(260,170,M.dirt,60,150,0,0.45);                           // 남동측 교란지(패드 주변)
// 진입로: Live Oak Rd → 야드 직선 + 북서 루프
pad(544,32,M.dirt,120,-62,0,0.55);
pad(140,32,M.dirt,-190,-96,0.55,0.55);
pad(90,32,M.dirt,-242,-142,0.95,0.55);
// Live Oak Rd
pad(52,630,M.road,410,0,0,0.6);
for(let z=-300;z<=300;z+=40)pad(2.2,16,M.white,410,z,0,0.8);

// ————— Vermilion 강
let waterMesh,waterBase;
{
  const g=new THREE.PlaneGeometry(180,660,isMobile?12:24,isMobile?30:60);g.rotateX(-Math.PI/2);
  waterBase=g.attributes.position.array.slice();
  waterMesh=new THREE.Mesh(g,M.water);waterMesh.position.set(-380,0.5,0);waterMesh.receiveShadow=true;scene.add(waterMesh);
  const bank=box(14,8,660,M.dirt,-290,0.6,0);bank.rotation.z=0.35;scene.add(bank);
}

// ————— 부두 · 선박 (양륙 컨베이어와 일직선)
function dockDeck(x,z){const g=new THREE.Group();
  g.add(box(46,2.2,16,M.wood,0,3.4,0));
  for(const dx of[-19,0,19])for(const dz of[-6,6])g.add(box(2.4,10,2.4,M.trunk,dx,-1,dz));
  g.position.set(x,0,z);scene.add(g);}
dockDeck(-310,36);dockDeck(-310,152);
const boat=new THREE.Group();
{
  // F/V AMELIA — 멘헤이든 퍼스세인선 (선수 조타실 · 중앙 하역붐 · 선미 스키프 2정)
  const L=150,B=28,H=13;
  const s=new THREE.Shape();
  s.moveTo(-L/2+8,-B/2);s.quadraticCurveTo(-L/2-4,0,-L/2+8,B/2);
  s.lineTo(L/2-36,B/2);s.quadraticCurveTo(L/2+6,3,L/2+10,0);
  s.quadraticCurveTo(L/2+6,-3,L/2-36,-B/2);s.closePath();
  const hg=new THREE.ExtrudeGeometry(s,{depth:H,bevelEnabled:false});hg.rotateX(-Math.PI/2);
  const hull=new THREE.Mesh(hg,M.hullRed);hull.castShadow=hull.receiveShadow=true;hull.position.y=-4;boat.add(hull);
  const dk=mesh(new THREE.PlaneGeometry(L-8,B-4),M.deck,0,9.15,0);dk.rotation.x=-Math.PI/2;boat.add(dk);
  for(const dz of[-(B/2-0.6),B/2-0.6])boat.add(box(46,2.6,1,M.white,48,8.4,dz));  // 선수 백색 셰어스트레이크
  // 선수 조타실 (2단 + 조타창 밴드 + 레이더 마스트)
  boat.add(box(24,8,20,M.white,46,12,0));
  boat.add(box(17,7,14,M.white,48,19.5,0));
  boat.add(box(17.2,2.2,14.2,M.steelDark,49,21.2,0));
  boat.add(box(1,9,1,M.steel,44,27.5,0));
  boat.add(box(6,0.6,0.6,M.steel,44,30.5,0));
  // 어창 해치 (중앙 작업갑판)
  for(const hx of[24,4,-16])boat.add(box(14,1.4,14,M.steelDark,hx,9.8,0));
  // 중앙 마스트 + 하역 붐(녹슨) + 리깅
  boat.add(mesh(new THREE.CylinderGeometry(1.1,1.3,34,8),M.steel,10,26,0));
  {const bm=mesh(new THREE.CylinderGeometry(0.9,1.1,44,8),M.wood,-6,30,3);bm.rotation.z=1.05;boat.add(bm);}
  {const c1=mesh(new THREE.CylinderGeometry(0.15,0.15,26,4),M.pipe,1,38,1.5);c1.rotation.z=0.5;boat.add(c1);}
  // 피시펌프·기계실 구조물 (백색)
  boat.add(box(14,8,16,M.white,-16,13,0));
  boat.add(box(8,11,8,M.white,-27,13.5,-4));
  boat.add(mesh(new THREE.CylinderGeometry(1.2,1.2,10,8),M.pipe,-24,20,5));
  // 선미 스키프 2정 (양현 경사 거치)
  for(const sd of[-1,1]){
    const sk=new THREE.Group();
    sk.add(box(21,3.2,6.5,M.steel,0,1.6,0));
    sk.add(box(5,2.6,5,M.steelDark,7.5,1.8,0));
    sk.position.set(-56,13.5,sd*8.5);
    sk.rotation.z=0.34;sk.rotation.y=sd*0.22;
    boat.add(sk);
    for(const bx of[-64,-48])boat.add(box(1.6,7,1.6,M.steelDark,bx,9.5,sd*8.5));
  }
  boat.position.set(-362,0,34);boat.rotation.y=Math.PI/2*1.02;scene.add(boat);
}
// 피시펌프 양륙 배관 (선체 → 부두) + 육상 펌프 유닛
{const pp=mesh(new THREE.CylinderGeometry(0.9,0.9,52,8),M.white,-324,4.5,42);pp.rotation.z=Math.PI/2;pp.rotation.y=0.1;scene.add(pp);}
{ // 부두 피시펌프 스테이션 (사진 기준: 스테인리스 인클로저 + 녹색 펌프 + 백색 배관)
  scene.add(box(11,6,7,M.steel,-294,3.6,54));                 // 펌프 엔진 인클로저
  scene.add(box(11.5,0.6,7.5,M.steelDark,-294,6.9,54));       // 상부 덮개

  {const el=mesh(new THREE.CylinderGeometry(1.3,1.3,8,8),M.white,-296,7.6,50);el.rotation.z=Math.PI/2;scene.add(el);} // 엘보 수평관
  {const dp=mesh(new THREE.CylinderGeometry(1.0,1.0,62,8),M.wood,-262,2.6,47);dp.rotation.z=Math.PI/2;dp.rotation.y=0.06;scene.add(dp);} // 육상 토출관(녹슨)
  scene.add(box(1.2,3.2,4.5,M.white,-306,6.4,30));            // 부두 제어반
  scene.add(box(1.2,2.6,3.5,M.white,-306,6.1,24));

  scene.add(mesh(new THREE.CylinderGeometry(1.3,1.3,3.2,10),M.vatBlue,-302,2.1,42));              // 청색 드럼

// ————— LBP 본동 (180'×100' · 오픈 구조 · 2층 계단형: 지면 슬래브 + 고상 장비 플랫폼, 홍수 대비)
const MB={x0:-150,x1:30,z0:-10,z1:90};

{
  const g=new THREE.Group();

  for(let x=MB.x0;x<=MB.x1;x+=30)for(const z of[MB.z0,MB.z1]){

{ // 서측 외부 브라인 탱크로 오르는 황색 계단 + 캣워크 (서측 개구부 방향)
  for(let i=0;i<8;i++)scene.add(box(1.9,0.35,4.2,M.crane,-116.5-i*2.05,1.2+i*1.5,34));

    const rl=box(21,0.4,0.4,M.crane,-124,10.1,sz);rl.rotation.z=0.63;scene.add(rl);
    for(let i=0;i<4;i++)scene.add(box(0.4,3.4,0.4,M.crane,-117.5-i*4.1,4.6+i*3.0,sz));

function makeSprite(text,sub,accent){
  const c=document.createElement('canvas');c.width=620;c.height=sub?170:120;
  const x=c.getContext('2d');
  x.fillStyle=accent?'#d9a521':'rgba(239,234,219,0.94)';
  x.strokeStyle='#25313a';x.lineWidth=5;
  const r=18,W=c.width-10,H=c.height-10;
  x.beginPath();
  x.moveTo(5+r,5);x.arcTo(5+W,5,5+W,5+H,r);x.arcTo(5+W,5+H,5,5+H,r);
  x.arcTo(5,5+H,5,5,r);x.arcTo(5,5,5+W,5,r);x.closePath();
  x.fill();x.stroke();
  x.fillStyle='#25313a';x.textAlign='center';
  x.font='700 50px system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  x.fillText(text,c.width/2,sub?76:78);
  if(sub){x.font='400 33px system-ui, sans-serif';x.globalAlpha=.8;x.fillText(sub,c.width/2,130);}
  const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  const s=0.135;sp.scale.set(c.width*s,c.height*s,1);return sp;
}

const target=new THREE.Vector3(-10,10,-10);
let theta=-0.75,phi=0.93,radius=820;
let curTheta=theta,curPhi=phi,curRadius=radius,curTarget=target.clone();
let dragging=false,panning=false,px=0,py=0,autoRotate=true;
const el=renderer.domElement;
el.addEventListener('contextmenu',e=>e.preventDefault());
const activePtrs=new Set();
el.addEventListener('pointerdown',e=>{
  autoRotate=false;activePtrs.add(e.pointerId);dragging=true;panning=(e.button===2||e.shiftKey);
  px=e.clientX;py=e.clientY;el.setPointerCapture(e.pointerId);
});
function endPtr(e){activePtrs.delete(e.pointerId);if(activePtrs.size===0)dragging=false;try{el.releasePointerCapture(e.pointerId);}catch(_){ }}
el.addEventListener('pointerup',endPtr);
el.addEventListener('pointercancel',endPtr);
el.addEventListener('pointermove',e=>{
  if(!dragging)return;
  if(activePtrs.size>1){px=e.clientX;py=e.clientY;return;}   // 핀치 중 회전 금지
  const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
  if(panning){
    const dir=new THREE.Vector3(),right=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);
    camera.getWorldDirection(dir);right.crossVectors(dir,up).normalize();
    const fwd=new THREE.Vector3().crossVectors(up,right).normalize();
    const k=curRadius*0.0016;
    target.addScaledVector(right,-dx*k);target.addScaledVector(fwd,dy*k);
    target.x=Math.max(-470,Math.min(470,target.x));
    target.z=Math.max(-330,Math.min(330,target.z));
  }else{
    theta-=dx*0.0055;
    phi=Math.max(0.14,Math.min(1.45,phi-dy*0.004));
  }
});
el.addEventListener('wheel',e=>{
  e.preventDefault();autoRotate=false;
  radius=Math.max(140,Math.min(1600,radius*(1+Math.sign(e.deltaY)*0.09)));
},{passive:false});
let pinchD=0;
el.addEventListener('touchstart',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];pinchD=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}},{passive:true});
el.addEventListener('touchmove',e=>{
  if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    radius=Math.max(140,Math.min(1600,radius*(pinchD/d)));pinchD=d;}
},{passive:true});

// ————— 루프
const clock=new THREE.Clock();
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let frameNo=0;
function animate(){
  requestAnimationFrame(animate);
  frameNo++;
  const t=clock.getElapsedTime();
  if(autoRotate&&!reduceMotion)theta+=0.0012;
  curTheta+=(theta-curTheta)*0.12;
  curPhi+=(phi-curPhi)*0.12;
  curRadius+=(radius-curRadius)*0.12;
  curTarget.lerp(target,0.12);
  camera.position.set(
    curTarget.x+curRadius*Math.sin(curPhi)*Math.sin(curTheta),
    curTarget.y+curRadius*Math.cos(curPhi),
    curTarget.z+curRadius*Math.sin(curPhi)*Math.cos(curTheta)
  );
  camera.lookAt(curTarget);
  needle.style.transform='rotate('+(-curTheta*180/Math.PI+180)+'deg)';
  if(!reduceMotion&&(!isMobile||frameNo%2===0)){
    const pos=waterMesh.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){
      const bx=waterBase[i*3],bz=waterBase[i*3+2];
      pos.array[i*3+1]=waterBase[i*3+1]+Math.sin(bx*0.05+t*1.1)*0.5+Math.cos(bz*0.06+t*0.7)*0.4;
    }
    pos.needsUpdate=true;
    boat.position.y=Math.sin(t*0.8)*0.35;
    boat.rotation.z=Math.sin(t*0.6)*0.008;
  }
  if(flowGroup.visible&&!reduceMotion){
    for(let i=0;i<dots.length;i++){
      const u=(t*0.04+i/dots.length)%1;
      dots[i].position.copy(flowCurve.getPointAt(u));
    }
  }
  renderer.render(scene,camera);
}
animate();
})();
